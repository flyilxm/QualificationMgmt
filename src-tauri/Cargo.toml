[package]
name = "app"
version = "0.1.0"
description = "资质类图片与 PDF 本地管理桌面应用"
authors = ["you"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
# devtools：允许打包后的 release 使用 Cmd+Option+I（mac）/ Ctrl+Shift+I（Win）打开 WebView 开发者工具；正式对外发布前可去掉该 feature
tauri = { version = "2.10.3", features = ["protocol-asset", "devtools"] }
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
walkdir = "2.5"
base64 = "0.22"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-log = "2"
