name: Build and Release

on:
  push:
    branches:
      - master
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            target: "aarch64-apple-darwin"
            args: "--target aarch64-apple-darwin"
          - platform: "macos-latest"
            target: "x86_64-apple-darwin"
            args: "--target x86_64-apple-darwin"
          - platform: "ubuntu-22.04"
            target: "x86_64-unknown-linux-gnu"
            args: ""
          - platform: "windows-latest"
            target: "x86_64-pc-windows-msvc"
            # 不生成 MSI/NSIS，仅 release 产物 + 后续打便携 zip
            args: "--no-bundle"

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build the app
        run: npm run tauri build -- ${{ matrix.args }}

      - name: Rename macOS artifacts to Chinese
        if: matrix.platform == 'macos-latest'
        run: |
          dmgPath="src-tauri/target/${{ matrix.target }}/release/bundle/dmg"
          appPath="src-tauri/target/${{ matrix.target }}/release/bundle/macos"
          if [ -d "$dmgPath" ]; then
            for f in "$dmgPath"/*.dmg; do
              [ -f "$f" ] || continue
              new=$(echo "$f" | sed 's/QualificationMgmt/华宇资质管理/g')
              if [ "$f" != "$new" ]; then mv "$f" "$new" && echo "Renamed: $f -> $new"; fi
            done
          fi
          if [ -d "$appPath" ]; then
            for d in "$appPath"/*.app; do
              [ -d "$d" ] || continue
              new=$(echo "$d" | sed 's/QualificationMgmt/华宇资质管理/g')
              if [ "$d" != "$new" ]; then mv "$d" "$new" && echo "Renamed: $d -> $new"; fi
            done
          fi

      - name: Rename Linux artifacts to Chinese
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          for sub in deb rpm appimage; do
            base="src-tauri/target/release/bundle/$sub"
            [ -d "$base" ] || continue
            for f in "$base"/*; do
              [ -e "$f" ] || continue
              case "$f" in *QualificationMgmt*)
                new=$(echo "$f" | sed 's/QualificationMgmt/华宇资质管理/g')
                if [ "$f" != "$new" ]; then mv "$f" "$new" && echo "Renamed: $f -> $new"; fi
                ;;
              esac
            done
          done

      - name: Create Windows portable package
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $rel = "src-tauri/target/release"
          $exe = Join-Path $rel "app.exe"
          if (-not (Test-Path $exe)) { throw "未找到 $exe（Cargo package 名称为 app）" }

          $raw = Get-Content -Raw src-tauri/tauri.conf.json
          if ($raw -notmatch '"version"\s*:\s*"([^"]+)"') { throw "无法解析 tauri.conf.json version" }
          $ver = $Matches[1]

          $folder = "华宇资质管理-便携版"
          if (Test-Path $folder) { Remove-Item -Recurse -Force $folder }
          New-Item -ItemType Directory -Force -Path $folder | Out-Null
          Copy-Item $exe (Join-Path $folder "华宇资质管理.exe")
          Get-ChildItem $rel -Filter "*.dll" -ErrorAction SilentlyContinue | ForEach-Object {
            Copy-Item $_.FullName $folder
          }

          $bundleDir = Join-Path $rel "bundle"
          New-Item -ItemType Directory -Force -Path $bundleDir | Out-Null
          $zipName = "华宇资质管理_${ver}_x64_portable.zip"
          $zipPath = Join-Path $bundleDir $zipName
          if (Test-Path $zipPath) { Remove-Item -Force $zipPath }
          Compress-Archive -Path $folder -DestinationPath $zipPath -Force
          Write-Host "Created portable: $zipPath"

      - name: Upload artifacts (macOS)
        if: matrix.platform == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app
          if-no-files-found: warn

      - name: Upload artifacts (Windows)
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.target }}-portable
          path: |
            src-tauri/target/release/bundle/*_portable.zip
          if-no-files-found: error

      - name: Upload artifacts (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.target }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: warn

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            **/*.dmg
            **/*.deb
            **/*.rpm
            **/*.AppImage
            **/*_portable.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
