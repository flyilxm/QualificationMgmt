name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            target: "universal-apple-darwin"
            args: "--target universal-apple-darwin"
          - platform: "windows-latest"
            target: "x86_64-pc-windows-msvc"
            # 不生成 MSI/NSIS，仅 release 产物 + 后续打便携 zip
            args: "--no-bundle"

    runs-on: ${{ matrix.platform }}
    environment: Thunisoft

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build the app (macOS - 签名 + 公证)
        if: matrix.platform == 'macos-latest'
        run: npm run tauri build -- ${{ matrix.args }}
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Build the app (Windows)
        if: matrix.platform == 'windows-latest'
        run: npm run tauri build -- ${{ matrix.args }}

      - name: Rename macOS artifacts to Chinese
        if: matrix.platform == 'macos-latest'
        run: |
          dmgPath="src-tauri/target/universal-apple-darwin/release/bundle/dmg"
          appPath="src-tauri/target/universal-apple-darwin/release/bundle/macos"
          if [ -d "$dmgPath" ]; then
            for f in "$dmgPath"/*.dmg; do
              [ -f "$f" ] || continue
              new=$(echo "$f" | sed 's/QualificationMgmt/华宇资质管理/g')
              if [ "$f" != "$new" ]; then mv "$f" "$new" && echo "Renamed: $f -> $new"; fi
            done
          fi
          if [ -d "$appPath" ]; then
            for d in "$appPath"/*.app; do
              [ -d "$d" ] || continue
              new=$(echo "$d" | sed 's/QualificationMgmt/华宇资质管理/g')
              if [ "$d" != "$new" ]; then mv "$d" "$new" && echo "Renamed: $d -> $new"; fi
            done
          fi

      - name: Create Windows portable package
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $rel = "src-tauri/target/release"
          $exe = Join-Path $rel "app.exe"
          if (-not (Test-Path $exe)) { throw "未找到 $exe（Cargo package 名称为 app）" }

          $raw = Get-Content -Raw src-tauri/tauri.conf.json
          if ($raw -notmatch '"version"\s*:\s*"([^"]+)"') { throw "无法解析 tauri.conf.json version" }
          $ver = $Matches[1]

          $folder = "华宇资质管理-便携版"
          if (Test-Path $folder) { Remove-Item -Recurse -Force $folder }
          New-Item -ItemType Directory -Force -Path $folder | Out-Null
          Copy-Item $exe (Join-Path $folder "华宇资质管理.exe")
          Get-ChildItem $rel -Filter "*.dll" -ErrorAction SilentlyContinue | ForEach-Object {
            Copy-Item $_.FullName $folder
          }

          $bundleDir = Join-Path $rel "bundle"
          New-Item -ItemType Directory -Force -Path $bundleDir | Out-Null
          $zipName = "华宇资质管理_${ver}_x64_portable.zip"
          $zipPath = Join-Path $bundleDir $zipName
          if (Test-Path $zipPath) { Remove-Item -Force $zipPath }
          Compress-Archive -Path $folder -DestinationPath $zipPath -Force
          Write-Host "Created portable: $zipPath"

      - name: Upload artifacts (macOS)
        if: matrix.platform == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: macos-universal
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app
          if-no-files-found: warn

      - name: Upload artifacts (Windows)
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.target }}-portable
          path: |
            src-tauri/target/release/bundle/*_portable.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            **/*.dmg
            **/*_portable.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
